<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="110" fill="#18191B"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad)" stroke-width="12" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad)" stroke-width="6"/>
  <!-- Lightning bolt / Pulse -->
  <path d="M280 80 L160 280 L250 280 L230 432 L352 232 L262 232 Z" fill="url(#grad)" filter="url(#glow)"/>
</svg>
